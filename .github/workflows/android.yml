name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android scaffold
        run: bash tool/bootstrap_android.sh

      - name: Install stable personal signing key
        run: |
          mkdir -p "$HOME/.android"
          cp tool/signing/whatsapp-responder-release.jks "$HOME/.android/debug.keystore"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-responder-v0.1.1-arm64-stable
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
