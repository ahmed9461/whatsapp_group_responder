name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android scaffold
        run: bash tool/bootstrap_android.sh

      - name: Install stable personal signing key
        run: |
          mkdir -p "$HOME/.android"
          cp tool/signing/whatsapp-responder-release.jks "$HOME/.android/debug.keystore"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload current ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-responder-v0.3.0-arm64-stable
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Delete older WhatsApp responder artifacts
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.workflow_run.id,.name] | @tsv' > /tmp/artifacts.tsv
          while IFS=$'\t' read -r id run_id name; do
            [ -z "${id:-}" ] && continue
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "Deleting previous artifact: $name ($id)"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done < /tmp/artifacts.tsv
